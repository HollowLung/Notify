[package]
name = "notify"
version = "0.1.0"
description = "A local-library music player with a fully customizable UI"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["dialog-open", "fs-all", "path-all", "protocol-asset", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.19"
uuid = { version = "1.8", features = ["v4"] }
dirs = "5.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
